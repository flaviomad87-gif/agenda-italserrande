crons:
  - name: promemoria-manut
    description: "Email giornaliera alle 7:30 con i contratti di manutenzione in scadenza entro 15 giorni"
    cron: "30 7 * * *"
    timezone: "Europe/Rome"
    endpoint: "{{BASE_URL}}/api/cron/manutenzioni"
    method: POST
    # Cron endpoints must ack 2xx immediately; enqueue/background the actual work.
    enabled: true
